name: test

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  test:
    # The README claims macOS, Linux and Windows support; run all three so the
    # claim is tested rather than asserted. Runners have no audio device, which
    # is fine: playback is optional by design and the suite asserts on generated
    # buffers, parsing and process behaviour, never on sound.
    runs-on: ${{ matrix.os }}
    # The suite takes ~2 minutes. A hang once held a runner for the 6-hour default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      # No dependencies to install - that is the point of the project.
      - run: npm test

  package:
    # Catches a broken bin shebang or a files[] entry that stops shipping.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm pack --dry-run
      - run: node bin/vibeaudio.js --version
      - run: node bin/vibeaudio.js --help
