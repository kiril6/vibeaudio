# Keeps the SHA-pinned actions in .github/workflows current. The package has no
# dependencies, so npm is deliberately not listed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # checkout 7.0.1's macOS/Node 18 test job hung twice (PR #56) while the
      # same job passes on 4.x; revisit once that is understood. Minor and
      # patch updates still come through.
      - dependency-name: actions/checkout
        update-types: ["version-update:semver-major"]
